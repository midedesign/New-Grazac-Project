<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>logoipsum</title>
    <link rel="stylesheet" href="landingpage.css" />
  </head>
  <body>
    <section class="navbar">
      <div class="logodiv">
        <img src="/Logo Color.svg" />
      </div>
      <div class="navlink">
        <p>
          <span class="homespan">Home</span>
        </p>
        <p>Features</p>
        <p>pricing</p>
        <p>Blog</p>
      </div>
      <div>
        <button class="navbut">Get Started</button>
      </div>
    </section>

    <section class="hero">
      <div>
        <h3 class="heroheading">Grow your <br />subscription <br />business</h3>
        <p class="heropara">
          Outcome-centered products that reduce churn, <br />optimize pricing,

        </p>

        <div class="herobutdiv">
          <button class="herobut">Get Started</button>

          <img src="/Down Arrow.png" class="downarrow"/>
        </div>
      </div>

      <div class="heroimg">
        <img src="/Hero 3D.png" alt="pic" />
      </div>
    </section>

  <div class="iconpdiv">
<div>

</div>
